version: '3.8'

services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf

  catalog:
    build:
      context: .
      dockerfile: services/catalog/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./config:/app/config
    depends_on:
      - mosquitto
    environment:
      - MQTT_BROKER=mosquitto
