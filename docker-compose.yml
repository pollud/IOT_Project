version: '3.8'

services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf

  catalog:
    build:
      context: .
      dockerfile: services/catalog/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./config:/app/config
    depends_on:
      - mosquitto
    environment:
      - MQTT_BROKER=mosquitto

  room_connector:
    build:
      context: .
      dockerfile: services/room_connector/Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      - mosquitto
    environment:
      - MQTT_BROKER=mosquitto
      - ROOM_ID=room1

  badge_connector:
    build:
      context: .
      dockerfile: services/badge_connector/Dockerfile
    ports:
      - "8082:8082"
    depends_on:
      - mosquitto
    environment:
      - MQTT_BROKER=mosquitto
      - ROOM_ID=room1
      - BADGE_ID=b1

  prop_connector:
    build:
      context: .
      dockerfile: services/prop_connector/Dockerfile
    ports:
      - "8083:8083"
    depends_on:
      - mosquitto
    environment:
      - MQTT_BROKER=mosquitto
      - ROOM_ID=room1
      - PROP_ID=prop1

  safety_monitor:
    build:
      context: .
      dockerfile: services/safety_monitor/Dockerfile
    depends_on:
      - mosquitto
    environment:
      - MQTT_BROKER=mosquitto

  room_control:
    build:
      context: .
      dockerfile: services/room_control/Dockerfile
    depends_on:
      - mosquitto
    volumes:
      - ./config:/app/config
    environment:
      - MQTT_BROKER=mosquitto
      - PYTHONUNBUFFERED=1
      - ROOM_ID=ALL

  timeseries_adapter:
    build:
      context: .
      dockerfile: services/timeseries_adapter/Dockerfile
    depends_on:
      - mosquitto
    volumes:
      - ./data:/app/data
    environment:
      - MQTT_BROKER=mosquitto

  analytics:
    build:
      context: .
      dockerfile: services/analytics/Dockerfile
    ports:
      - "8084:8084"
    volumes:
      - ./data:/app/data

  web_dashboard:
    build:
      context: .
      dockerfile: services/web_dashboard/Dockerfile
    ports:
      - "8087:8087"
    depends_on:
      - mosquitto
    environment:
      - MQTT_BROKER=mosquitto

  room_connector_2:
    build:
      context: .
      dockerfile: services/room_connector/Dockerfile
    depends_on:
      - mosquitto
    environment:
      - MQTT_BROKER=mosquitto
      - ROOM_ID=room2

  badge_connector_2:
    build:
      context: .
      dockerfile: services/badge_connector/Dockerfile
    depends_on:
      - mosquitto
    environment:
      - MQTT_BROKER=mosquitto
      - ROOM_ID=room2
      - BADGE_ID=b2

  prop_connector_2:
    build:
      context: .
      dockerfile: services/prop_connector/Dockerfile
    depends_on:
      - mosquitto
    environment:
      - MQTT_BROKER=mosquitto
      - ROOM_ID=room2
      - PROP_ID=prop2

  room_control_2:
    build:
      context: .
      dockerfile: services/room_control/Dockerfile
    depends_on:
      - mosquitto
    volumes:
      - ./config:/app/config
    environment:
      - MQTT_BROKER=mosquitto
      - ROOM_ID=room2
