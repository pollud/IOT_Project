version: '3.8'

services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf

  catalog:
    build:
      context: .
      dockerfile: services/catalog/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./config:/app/config
    depends_on:
      - mosquitto
    environment:
      - MQTT_BROKER=mosquitto

  room_connector:
    build:
      context: .
      dockerfile: services/room_connector/Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      - mosquitto
    environment:
      - MQTT_BROKER=mosquitto
      - ROOM_ID=room1

  badge_connector:
    build:
      context: .
      dockerfile: services/badge_connector/Dockerfile
    ports:
      - "8082:8082"
    depends_on:
      - mosquitto
    environment:
      - MQTT_BROKER=mosquitto
      - ROOM_ID=room1
      - BADGE_ID=b1

  prop_connector:
    build:
      context: .
      dockerfile: services/prop_connector/Dockerfile
    ports:
      - "8083:8083"
    depends_on:
      - mosquitto
    environment:
      - MQTT_BROKER=mosquitto
      - ROOM_ID=room1
      - PROP_ID=prop1

  safety_monitor:
    build:
      context: .
      dockerfile: services/safety_monitor/Dockerfile
    depends_on:
      - mosquitto
    environment:
      - MQTT_BROKER=mosquitto

  room_control:
    build:
      context: .
      dockerfile: services/room_control/Dockerfile
    depends_on:
      - mosquitto
    volumes:
      - ./config:/app/config
    environment:
      - MQTT_BROKER=mosquitto
      - ROOM_ID=room1

  timeseries_adapter:
    build:
      context: .
      dockerfile: services/timeseries_adapter/Dockerfile
    depends_on:
      - mosquitto
    volumes:
      - ./data:/app/data
    environment:
      - MQTT_BROKER=mosquitto
