[project]
name = "escape-room-iot"
version = "2.0.0"
description = "Microservice IoT platform for concurrent escape rooms"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "CherryPy==18.9.0",
    "jsonschema==4.21.1",
    "paho-mqtt==1.6.1",
    "requests==2.33.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers"
pythonpath = ["."]
testpaths = ["tests/unit"]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["services/web_dashboard/node_modules", "services/web_dashboard/dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

