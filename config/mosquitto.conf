listener 1883 0.0.0.0

# Demo mode: the broker is reachable only from the private Compose network and
# 127.0.0.1 on the host. For a shared/remote deployment, replace this with a
# Mosquitto password_file (or TLS client certificates) and disable anonymous access.
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
autosave_interval 30

max_queued_messages 10000
max_inflight_messages 100
message_size_limit 1048576

log_dest stdout
log_type error
log_type warning
log_type notice
